  :root {
    --peach: #FBD4D1; --mint: #CDE5C0; --apricot: #FBDFC2;
    --peach-deep: #D98C85;
    --cream: #FFFBF7; --card: #FFFFFF;
    --ink: #4A443F; --ink-soft: #9A9289;
    --font-sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC",
                 "Hiragino Sans", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 40px 16px calc(40px + env(safe-area-inset-bottom));
    font-family: var(--font-sans);
    color: var(--ink);
    background: var(--cream);
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: -12%; z-index: -1;
    background:
      radial-gradient(58% 44% at 14%   6%, #FBD4D1d9, #FBD4D100 72%),
      radial-gradient(54% 40% at 88%  32%, #FBDFC2cc, #FBDFC200 72%),
      radial-gradient(72% 50% at 46% 102%, #CDE5C0cc, #CDE5C000 72%),
      var(--cream);
    filter: blur(14px);
  }
  .box { width: 100%; max-width: 420px; text-align: center; }
  .shot {
    display: block; width: 100%; height: auto;
    border-radius: 22px;
    box-shadow: 0 10px 30px -14px #4A443F66, 0 1px 2px #4A443F0a;
  }
  .code {
    margin: 22px 0 0;
    font-size: clamp(42px, 14vw, 58px); font-weight: 800;
    letter-spacing: -.03em; line-height: 1;
  }
  .say { margin: 8px 0 0; font-size: 16px; }
  .sub { margin: 6px 0 0; font-size: 13px; color: var(--ink-soft); line-height: 1.7; }
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 44px; margin-top: 22px; padding: 0 22px;
    border: 1.5px solid var(--peach-deep); border-radius: 999px;
    background: var(--card); color: var(--ink);
    font-size: 14px; font-weight: 600; text-decoration: none;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
