<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBF7">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:;
               script-src 'self'; style-src 'self' 'unsafe-inline';
               base-uri 'none'; form-action 'none'">
<title>曼谷 5 日・奶愛FC踩點之旅</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="images/icons/icon-180.png">

<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<div class="deck" id="deck"></div>

<button class="arrow arrow--prev" id="prev" aria-label="前一天">‹</button>
<button class="arrow arrow--next" id="next" aria-label="後一天">›</button>

<nav class="dots" id="dots" aria-label="選擇日期"></nav>

<div class="buddy" id="buddy">
  <button class="buddy__face" id="buddyBtn" aria-label="開啟選單" aria-haspopup="menu" aria-expanded="false">
    <img src="images/muvmuv-head.webp" alt="" draggable="false">
  </button>
  <div class="buddy__menu" id="buddyMenu" role="menu" hidden>
    <button class="buddy__item" id="openOverview" role="menuitem" aria-haspopup="dialog">📅 總表</button>
    <button class="buddy__item" id="openChecklist" role="menuitem" aria-haspopup="dialog">🛒 購物清單</button>
  </div>
</div>

<dialog class="overview" id="overview" aria-labelledby="overviewTitle"></dialog>
<dialog class="checklist" id="checklist" aria-labelledby="checklistTitle"></dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
