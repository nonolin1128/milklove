<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBF7">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:;
               script-src 'self' 'sha256-MSTJdICgj0JeIduWv5y/CLtbMiCPcpEA2mPhZOTWCZI='; style-src 'self' 'unsafe-inline';
               base-uri 'none'; form-action 'none'">
<title>曼谷 5 日・ML-FC</title>

<!-- 設計設定（顏色、字級、間距）在 css/theme.css -->
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<!-- 一天一張卡，由 js/app.js 填入 -->
<div class="deck" id="deck"></div>

<button class="arrow arrow--prev" id="prev" aria-label="前一天">‹</button>
<button class="arrow arrow--next" id="next" aria-label="後一天">›</button>

<nav class="dots" id="dots" aria-label="選擇日期"></nav>

<!-- 直接雙擊 index.html（file://）時 ES module 會被瀏覽器擋住，顯示這段提示 -->
<div class="fallback" id="fallback" hidden>
  <strong>需要用網址開啟，不能直接雙擊檔案。</strong>
  在專案資料夾執行這行，然後開 http://localhost:8000
  <code>npm run dev</code>
</div>

<script type="module" src="js/app.js"></script>
<!-- 這段是行內 script，CSP 用 sha256 放行（見 <head>）。
     改動內容（連空白）都會讓 hash 失效、這段被瀏覽器擋掉。
     改完重算：npm run csp-hash -->
<script>
  /* 模組沒跑起來（例如用 file:// 開啟）就顯示提示 */
  setTimeout(function () {
    if (!document.getElementById("deck").children.length) {
      document.getElementById("fallback").hidden = false;
    }
  }, 700);
</script>
</body>
</html>
